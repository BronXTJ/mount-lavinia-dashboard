# Builds with VITE_CARTO_API_KEY (repository secret) and publishes dist/ to gh-pages.
# GitHub Pages should use the gh-pages branch (Settings → Pages → Deploy from branch).
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/build-for-pages.mjs'
      - 'scripts/carto-env.mjs'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
      - run: cp dist/index.html dist/404.html
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
